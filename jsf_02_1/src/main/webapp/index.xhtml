<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	>
<h:head>
	<title>Kalkulator kredytowy</title>
</h:head>
<h:body>

    <p:panel id="loancalc_panel" header="Kalkulator kredytowy">
	    <h:form id="loancalc">
			<h:panelGrid columns="3" cellpadding="3" layout="grid">
	    		<p:outputLabel for="amount" value="Kwota (zł):"/>
	            <p:inputNumber id="amount" value="#{calcBB.amount}" modifyValueOnWheel="false" required="true" requiredMessage="Kwota nie moze być pusta." converterMessage="Kwota musi być liczbą." validatorMessage="Kwota musi być z przedziału [1; 1000000].">
	            	<f:validateDoubleRange minimum="1" maximum="1000000"/>
	            </p:inputNumber>
	            <p:message for="amount" id="amount_msg"/>
	
	    		<p:outputLabel for="percentage" value="Oprocentowanie (%):"/>
	            <p:inputNumber id="percentage" value="#{calcBB.percentage}" modifyValueOnWheel="false" required="true" requiredMessage="Oprocentowanie nie moze być puste." converterMessage="Oprocentowanie musi być liczbą." validatorMessage="Oprocentowanie musi być z przedziału [0; 100].">
	            	<f:validateDoubleRange minimum="0" maximum="100"/>
	            </p:inputNumber>
	            <p:message for="percentage" id="percantage_msg"/>
	
	    		<p:outputLabel for="time" value="Czas kredytu (lata):"/>
	            <p:inputNumber id="time" value="#{calcBB.time}" modifyValueOnWheel="false" required="true" requiredMessage="Czas nie moze być pusty." converterMessage="Czas musi być liczbą." validatorMessage="Czas musi być z przedziału [1; 100].">
	            	<f:validateDoubleRange minimum="1" maximum="100"/>
	            </p:inputNumber>
	            <p:message for="time" id="time_msg"/>
	            
	            <div></div>
				<p:commandButton type="submit" value="Oblicz" action="#{calcBB.calc()}" update="result, messages, amount_msg, time_msg, percentage_msg" />
			
			</h:panelGrid>
	    </h:form>
	    
	    <p:card id="result" style="display:#{empty calcBB.result ? 'none' : 'block'}">
	    	<p>Miesięczna rata: #{calcBB.result} PLN</p>
	    </p:card>
	    
	     <p:messages id="messages" showDetail="true" closable="true" redisplay="false">
        </p:messages>
	   
    </p:panel>

</h:body>
</html>
